<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180410" />
      <stop offset="50%" stop-color="#3b0724" />
      <stop offset="100%" stop-color="#0a0106" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="650" cy="100" r="180" fill="#e11d48" opacity="0.12" filter="blur(40px)" />
  <circle cx="150" cy="350" r="150" fill="#9333ea" opacity="0.15" filter="blur(40px)" />
  
  <!-- Grid lines -->
  <path d="M 50 50 L 750 50 M 50 150 L 750 150 M 50 250 L 750 250 M 50 350 L 750 350" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <path d="M 150 50 L 150 400 M 350 50 L 350 400 M 550 50 L 550 400" stroke="rgba(255,255,255,0.04)" stroke-width="1" />

  <!-- Center Card Illustration -->
  <rect x="180" y="90" width="440" height="270" rx="16" fill="rgba(20, 5, 15, 0.7)" stroke="url(#neon)" stroke-width="2" />
  <circle cx="220" cy="125" r="6" fill="#f43f5e" />
  <circle cx="240" cy="125" r="6" fill="#f59e0b" />
  <circle cx="260" cy="125" r="6" fill="#10b981" />

  <!-- Dynamic Waveform / Frames preview -->
  <path d="M 220 280 Q 280 180 340 240 T 460 210 T 580 250" fill="none" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" />
  <text x="400" y="195" font-family="'Outfit', sans-serif" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">NeuralMotion Engine</text>
  <text x="400" y="230" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">240-Frame Scroll Synchronized Portrait Animation</text>
</svg>
